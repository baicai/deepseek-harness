name: iMaoHao-dsh Windows Build

on:
  push:
    branches: [imaohao-branding-test]
    paths:
      - 'apps/desktop/**'
      - 'apps/desktop-host/**'
      - 'examples/imaohao-integration/**'
      - 'apps/web/**'
      - 'packages/llm/**'
      - 'packages/core/agent-default-model/**'
      - 'packages/bundle/**'
      - 'packages/client/**'
      - '.github/workflows/imaohao-desktop-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/desktop/**'
      - 'apps/desktop-host/**'
      - 'examples/imaohao-integration/**'
      - 'apps/web/**'
      - 'packages/llm/**'
      - 'packages/core/agent-default-model/**'
      - 'packages/bundle/**'
      - 'packages/client/**'
      - '.github/workflows/imaohao-desktop-build.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: imaohao-desktop-branding-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DSH_TELEMETRY_DISABLED: '1'
  IMAOHAO_BRANDING_TEST: '1'
  DSH_CLIENT_IMAOHAO_BRANDING: '1'

jobs:
  windows-x64:
    name: Windows x64 unsigned EXE
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify mock providers appear in Host catalog without real credentials
        run: pnpm exec vitest run packages/llm/llm-pi-ai/tests/adapter.spec.ts apps/desktop-host/tests/imaohao-mock.spec.ts

      - name: Verify customer integration contract
        run: node examples/imaohao-integration/contract-test.mjs

      - name: Render iMaoHao-dsh actual-brand desktop icons
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop exec node scripts/render-imaohao-assets.mjs
          pnpm --filter @deepseek-ai/dsh-desktop run render:tray-icon

      - name: Prepare local unsigned Windows packaging config
        shell: pwsh
        run: |
          @"
          DSH_DESKTOP_APP_ID=com.imaohao.dsh
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://example.com
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://example.com"]}'
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          "@ | Set-Content -Path apps/desktop/.env.windows -Encoding utf8

      - name: Build unsigned Windows installer
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Verify in-place reinstall with actual packaged NSIS installer
        shell: pwsh
        run: |
          & ./apps/desktop/tests/windows-imaohao-reinstall-smoke.ps1 -ArtifactDirectory 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: iMaoHao-dsh-windows-x64-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish shareable GitHub prerelease after Windows installation smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/imaohao-branding-test'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'imaohao-dsh-demo-' + $env:GITHUB_SHA.Substring(0,12)
          $artifactDir = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $exe = @(Get-ChildItem -LiteralPath $artifactDir -File -Filter 'iMaoHao-dsh-*-win-x64-unsigned.exe')
          if ($exe.Count -ne 1) { throw "Expected exactly one installer, found $($exe.Count)" }
          $kit = Join-Path $env:RUNNER_TEMP 'iMaoHao-DSH-Customer-Integration-Kit.zip'
          Compress-Archive -Path 'examples/imaohao-integration/*' -DestinationPath $kit -CompressionLevel Optimal -Force
          $notes = @'
          PRE-RELEASE DEMO: Actual DSH Electron Windows x64 client with iMaoHao branding, local mock account and model routes, and optional external customer integration gateway.
          Built on Windows and gated by install/reinstall smoke. Mock replies are NOT real model inference.
          Unsigned EXE: Windows SmartScreen may warn.
          Remaining manual acceptance: launch, login, switch the two model routes, send messages, DSH session/tool regression, user-data and custom path.
          '@
          gh release create $tag $exe[0].FullName $kit --target $env:GITHUB_SHA --title "iMaoHao DSH Desktop Demo $tag" --notes $notes --prerelease
          Write-Host "GitHub Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"

      - name: Upload Windows packaging logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: iMaoHao-dsh-windows-logs-${{ github.sha }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 7
