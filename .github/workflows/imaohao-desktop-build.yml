name: iMaoHao-dsh Windows Build

on:
  push:
    branches: [imaohao-branding-test]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/bundle/**'
      - 'packages/client/**'
      - '.github/workflows/imaohao-desktop-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/bundle/**'
      - 'packages/client/**'
      - '.github/workflows/imaohao-desktop-build.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: imaohao-desktop-branding-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DSH_TELEMETRY_DISABLED: '1'
  IMAOHAO_BRANDING_TEST: '1'
  DSH_CLIENT_IMAOHAO_BRANDING: '1'

jobs:
  windows-x64:
    name: Windows x64 unsigned EXE
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify mock providers appear in Host catalog without real credentials
        run: pnpm exec vitest run packages/llm/llm-pi-ai/tests/adapter.spec.ts apps/desktop-host/tests/imaohao-mock.spec.ts

      - name: Render iMaoHao-dsh actual-brand desktop icons
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop exec node scripts/render-imaohao-assets.mjs
          pnpm --filter @deepseek-ai/dsh-desktop run render:tray-icon

      - name: Prepare local unsigned Windows packaging config
        shell: pwsh
        run: |
          @"
          DSH_DESKTOP_APP_ID=com.imaohao.dsh
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://example.com
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://example.com"]}'
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          "@ | Set-Content -Path apps/desktop/.env.windows -Encoding utf8

      - name: Build unsigned Windows installer
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: iMaoHao-dsh-windows-x64-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows packaging logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: iMaoHao-dsh-windows-logs-${{ github.sha }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 7
